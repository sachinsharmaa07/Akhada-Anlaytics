# ── Akhada Analytics – Docker Compose ──

services:
  # ── MongoDB ──
  mongo:
    image: mongo:7
    container_name: akhada-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - akhada-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Node.js / Express) ──
  backend:
    image: ${BACKEND_IMAGE:-akhada-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: akhada-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/akhada_analytics}
      - PORT=${PORT:-5001}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - akhada-net

  # ── Client (React → nginx) ──
  client:
    image: ${CLIENT_IMAGE:-akhada-client:local}
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5001/api}
        REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID:-}
    container_name: akhada-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - akhada-net

volumes:
  mongo_data:

networks:
  akhada-net:
    driver: bridge
