# ── CD: Deploy to Render (backend) & Vercel (client) ──
# Triggered only on push to main (after CI passes).

name: CD — Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false          # never cancel an in-flight deploy

jobs:
  # ─── Gate: run CI first ────────────────────────────────────
  ci:
    name: ✅ CI Gate
    uses: ./.github/workflows/ci.yml

  # ─── Deploy Backend to Render ──────────────────────────────
  deploy-backend:
    name: 🚀 Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK_URL secret not set — skipping Render deploy."
            echo "   → Go to Render dashboard > Service > Settings > Deploy Hook"
            echo "   → Copy the URL and add it as a GitHub secret."
            exit 0
          fi

          echo "🚀 Triggering Render deploy..."
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          if [ "$response" -eq 200 ] || [ "$response" -eq 201 ]; then
            echo "✅ Render deploy triggered successfully (HTTP $response)"
          else
            echo "❌ Render deploy trigger failed (HTTP $response)"
            exit 1
          fi

  # ─── Deploy Client to Vercel ───────────────────────────────
  deploy-client:
    name: 🌐 Deploy Client → Vercel
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "⚠️  VERCEL_TOKEN secret not set — skipping Vercel deploy."
            echo "   → Run: vercel link  (in the client/ folder)"
            echo "   → Then add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID as GitHub secrets."
            exit 0
          fi
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build with Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then exit 0; fi
          vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then exit 0; fi
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
          echo "✅ Vercel production deploy complete"
