# ── CD: Deploy to AWS EC2 via SSH ──
# Triggered on push to main (after CI passes).

name: CD — Deploy to AWS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Gate: run CI first ────────────────────────────────────
  ci:
    name: ✅ CI Gate
    uses: ./.github/workflows/ci.yml

  # ─── Deploy to EC2 via SSH ─────────────────────────────────
  deploy:
    name: 🚀 Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          if [ -z "$EC2_SSH_KEY" ] || [ -z "$EC2_HOST" ]; then
            echo "⚠️  EC2 secrets not configured — skipping AWS deploy."
            echo "   → Add EC2_SSH_KEY, EC2_HOST, EC2_USER as GitHub secrets."
            exit 0
          fi

          # Write SSH key to file
          echo "$EC2_SSH_KEY" > /tmp/ec2_key.pem
          chmod 400 /tmp/ec2_key.pem

          # Deploy
          ssh -o StrictHostKeyChecking=no -i /tmp/ec2_key.pem ${EC2_USER}@${EC2_HOST} << 'DEPLOY_SCRIPT'
            set -e
            echo "🔄 Pulling latest code..."
            cd ~/Akhada-Anlaytics
            git pull origin main

            echo "🐳 Rebuilding containers..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deploy complete!"
            docker compose -f docker-compose.prod.yml ps
          DEPLOY_SCRIPT

          # Clean up
          rm -f /tmp/ec2_key.pem
          echo "✅ AWS EC2 deployment finished successfully"
