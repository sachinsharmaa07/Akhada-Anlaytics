# ── CI: Lint, Build & Test ──
# Runs on every push and pull request to validate code quality.

name: CI — Test & Build

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  # ─── Backend ───────────────────────────────────────────────
  backend:
    name: 🔧 Backend — Install & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check backend server syntax
        run: node --check backend/server.js

      - name: Verify all backend modules resolve
        run: |
          node -e "
            process.env.MONGO_URI = 'mongodb://localhost:27017/test';
            process.env.JWT_SECRET = 'ci-test';
            process.env.JWT_REFRESH_SECRET = 'ci-test';
            process.env.CLIENT_URL = 'http://localhost:3000';
            try {
              require('./backend/routes/auth');
              require('./backend/routes/user');
              require('./backend/routes/workout');
              require('./backend/routes/nutrition');
              require('./backend/routes/food');
              console.log('✅ All backend modules resolve successfully');
            } catch (e) {
              console.error('❌ Module resolution failed:', e.message);
              process.exit(1);
            }
          "

  # ─── Client (React) ───────────────────────────────────────
  client:
    name: ⚛️  Client — Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:5001/api
          REACT_APP_GOOGLE_CLIENT_ID: ci-placeholder
        run: npm run build

      - name: Run tests
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

  # ─── Docker Build Validation ───────────────────────────────
  docker:
    name: 🐳 Docker — Compose Build
    runs-on: ubuntu-latest
    needs: [backend, client]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create dummy .env for Docker build
        run: |
          cat > .env <<EOF
          MONGO_URI=mongodb://mongo:27017/akhada_analytics
          PORT=5001
          NODE_ENV=production
          JWT_SECRET=ci-docker-test
          JWT_REFRESH_SECRET=ci-docker-test
          CLIENT_URL=http://localhost:3000
          GOOGLE_CLIENT_ID=ci-placeholder
          GOOGLE_CLIENT_SECRET=ci-placeholder
          EOF

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: akhada-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: client/Dockerfile
          push: false
          tags: akhada-client:ci
          build-args: |
            REACT_APP_API_URL=http://localhost:5001/api
            REACT_APP_GOOGLE_CLIENT_ID=ci-placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify images were created
        run: |
          echo "── Docker images ──"
          docker images --filter "reference=akhada-*" --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          echo ""
          echo "✅ All Docker images built successfully"

      - name: CI Summary
        if: always()
        run: |
          echo "## 🏗️ CI Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend   | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Client    | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker    | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
