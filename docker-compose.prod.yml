# ── Akhada Analytics – Production Docker Compose (AWS EC2) ──
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  # ── MongoDB ──
  mongo:
    image: mongo:7
    container_name: akhada-mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - akhada-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports exposed — only accessible internally via akhada-net

  # ── Backend (Node.js / Express) ──
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: akhada-backend
    restart: always
    expose:
      - "5001"
    env_file:
      - .env.prod
    environment:
      - MONGO_URI=mongodb://mongo:27017/akhada_analytics
      - PORT=5001
      - NODE_ENV=production
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - akhada-net

  # ── Client (React → nginx) ──
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: https://${DOMAIN:-localhost}/api
        REACT_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: akhada-client
    restart: always
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - akhada-net

  # ── Nginx Reverse Proxy (SSL termination) ──
  nginx:
    image: nginx:stable-alpine
    container_name: akhada-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - client
      - backend
    networks:
      - akhada-net

  # ── Certbot (auto-renew SSL) ──
  certbot:
    image: certbot/certbot
    container_name: akhada-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    depends_on:
      - nginx

volumes:
  mongo_data:
  certbot_webroot:

networks:
  akhada-net:
    driver: bridge
