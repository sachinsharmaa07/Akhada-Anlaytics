# ── Akhada Analytics – Production Docker Compose (EC2) ──
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  # ── MongoDB ──
  mongo:
    image: mongo:7
    container_name: akhada-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - akhada-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backend (Node.js / Express) ──
  backend:
    image: ${DOCKERHUB_USERNAME}/akhada-backend:latest
    container_name: akhada-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/akhada_analytics
      - PORT=5001
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - akhada-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Client (React → Nginx) ──
  client:
    image: ${DOCKERHUB_USERNAME}/akhada-client:latest
    container_name: akhada-client
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - akhada-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── Nginx Reverse Proxy (entry point) ──
  nginx:
    image: nginx:stable-alpine
    container_name: akhada-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - backend
    networks:
      - akhada-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  mongo_data:

networks:
  akhada-net:
    driver: bridge
